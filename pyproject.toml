[project]
name = "mtto"
version = "0.1.0"
description = "Maglev Train Trajectory Optimization based on Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gymnasium[other]>=1.2.3",
    "matplotlib>=3.10.8",
    "numba>=0.65.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pytest>=9.0.2",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "stable-baselines3>=2.7.1",
    "tensorboard>=2.21.0",
    "torch>=2.3,<3",
    "tqdm>=4.67.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "D100", # 允许缺少文档字符串
    "S101", # 允许在测试中使用 assert
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
