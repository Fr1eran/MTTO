## Example [train] configuration for `mtto train --config paper/specs/train.toml ...`.
##
## Matches the paper method-ablation configuration in paper/specs/method_ablation.toml
## ([train] table, shared across all four reward-preset variants), fixed to the
## PIRS preset and the first of the five paper seeds (11, 131, 239, 359, 443).
[train]
reward_preset = "basic_safety_punctuality"
step_time_s = 1.0
gamma = 0.998
budget_mode = "environment_steps"
# training_episodes omitted: None in environment_steps mode
training_rollouts = 400
num_envs = 8
n_steps_per_env = 1024
evaluation_interval_rollouts = 12
# evaluation_interval_episodes omitted: None when evaluating by rollouts
evaluation_deterministic = true
keep_best = true
safety_truncation_bin_size_m = 5000.0
device = "cpu"
seed = 11
